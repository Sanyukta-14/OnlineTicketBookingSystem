services:

  # =========================================================
  # MYSQL DATABASE
  # =========================================================

  mysql:

    image: mysql:8.0

    container_name: ticket-booking-mysql

    restart: unless-stopped

    environment:

      MYSQL_ROOT_PASSWORD: tiger140105

      MYSQL_DATABASE: ticket_booking_db

    volumes:

      - mysql_data:/var/lib/mysql

    healthcheck:

      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-ptiger140105"
        ]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 20s


  # =========================================================
  # SPRING BOOT BACKEND
  # =========================================================

  backend:

    build:

      context: ./backend/ticket-booking-backend

    container_name: ticket-booking-backend

    restart: unless-stopped

    depends_on:

      mysql:

        condition: service_healthy

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticket_booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: tiger140105

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    ports:

      - "8080:8080"


  # =========================================================
  # REACT FRONTEND
  # =========================================================

  frontend:

    build:

      context: ./frontend/ticket-booking-frontend

    container_name: ticket-booking-frontend

    restart: unless-stopped

    depends_on:

      - backend

    ports:

      - "3000:80"


# =========================================================
# MYSQL PERSISTENT STORAGE
# =========================================================

volumes:

  mysql_data:
